name: Build Gangue Da Welcia

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Baixar Forge MDK 1.8.9 (para pegar o gradlew)
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/forge-1.8.9-11.15.1.2318-1.8.9-mdk.zip
          unzip -q mdk.zip -d mdk
          MD=$(dirname "$(find mdk -name gradlew | head -n 1)")
          cp -r "$MD/gradle" .
          cp "$MD/gradlew" "$MD/gradlew.bat" .
          chmod +x gradlew

      - name: Preparar o Minecraft
        run: ./gradlew setupCIWorkspace --no-daemon

      - name: Converter nomes internos para nomes MCP
        run: |
          python3 - <<'PYEOF'
          import csv, io, os, re, sys, zipfile
          G = os.path.join(os.path.expanduser("~"), ".gradle")
          M = {}
          def add(t):
              for r in csv.reader(io.StringIO(t)):
                  if len(r) >= 2 and r[0].startswith(("func_", "field_")):
                      M[r[0]] = r[1]
          for d, _, fs in os.walk(G):
              for f in fs:
                  p = os.path.join(d, f)
                  if f.startswith("mcp_stable") and f.endswith(".zip"):
                      z = zipfile.ZipFile(p)
                      for n in z.namelist():
                          if n.endswith(("fields.csv", "methods.csv")):
                              add(z.read(n).decode("utf-8", "replace"))
          if not M:
              print("ERRO: tabela mcp_stable nao encontrada")
              sys.exit(1)
          print("Nomes na tabela:", len(M))
          pat = re.compile(r"\b(?:func|field)_\d+_[A-Za-z0-9_]+\b")
          miss = set()
          cnt = [0]
          def sub(m):
              n = m.group(0)
              if n in M:
                  cnt[0] += 1
                  return M[n]
              miss.add(n)
              return n
          for d, _, fs in os.walk("src/main/java"):
              for f in fs:
                  if f.endswith(".java"):
                      p = os.path.join(d, f)
                      t = open(p, encoding="utf-8").read()
                      u = pat.sub(sub, t)
                      if u != t:
                          open(p, "w", encoding="utf-8").write(u)
          print("Trocas:", cnt[0])
          print("Sem nome:", sorted(miss))
          PYEOF

      - name: Compilar
        run: ./gradlew build --no-daemon

      - name: Guardar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: GangueDaWelcia-jar
          path: build/libs/*.jar
